# Name of your application. Used to uniquely configure containers.
service: rota_velho_chico

# Name of the container image (use your-user/app-name on external registries).
image: TiagosailE/rota_velho_chico

# Deploy to these servers.
# SUBSTITUA pelo IP da VPS depois de cria-la (Hetzner CX22 ou equivalente).
# Sem dominio por enquanto -- acesso direto pelo IP.
servers:
  web:
    - SUBSTITUA_PELO_IP_DA_VPS
  # job:
  #   hosts:
  #     - SUBSTITUA_PELO_IP_DA_VPS
  #   cmd: bin/jobs

# Sem proxy/SSL por enquanto -- sem dominio, nao ha certificado Let's Encrypt
# pra emitir. Ver PLANO.md para o que muda quando um dominio entrar.
# proxy:
#   ssl: true
#   host: app.example.com

# Onde as imagens de container ficam. GitHub Container Registry: mesma conta
# do repositorio, sem precisar criar cadastro em outro provedor.
registry:
  server: ghcr.io
  username: TiagosailE

  # Personal Access Token do GitHub com escopo write:packages (nao a senha).
  password:
    - KAMAL_REGISTRY_PASSWORD

# Inject ENV variables into containers (secrets come from .kamal/secrets).
env:
  secret:
    - RAILS_MASTER_KEY
    - ROTA_VELHO_CHICO_DATABASE_PASSWORD
  clear:
    # Run the Solid Queue Supervisor inside the web server's Puma process to do jobs.
    # Unico servidor por enquanto -- revisitar se o job processing crescer.
    SOLID_QUEUE_IN_PUMA: true

    # Nome do container do accessory de banco (ver accessories/db abaixo),
    # resolvivel pela rede Docker interna que o Kamal cria entre app e
    # accessories no mesmo host. Precisa bater com config/database.yml.
    DB_HOST: rota_velho_chico-db

# Aliases are triggered with "bin/kamal <alias>". You can overwrite arguments on invocation:
# "bin/kamal logs -r job" will tail logs from the first server in the job section.
aliases:
  console: app exec --interactive --reuse "bin/rails console"
  shell: app exec --interactive --reuse "bash"
  logs: app logs -f
  dbc: app exec --interactive --reuse "bin/rails dbconsole --include-password"

# Storage do Active Storage (sem uso ainda no app, mas mantido pelo scaffold
# padrao do Rails -- nao ha SQLite aqui, o banco e o accessory Postgres).
volumes:
  - "rota_velho_chico_storage:/rails/storage"

# Bridge fingerprinted assets, like JS and CSS, between versions to avoid
# hitting 404 on in-flight requests. Combines all files from new and old
# version inside the asset_path.
asset_path: /rails/public/assets

# Configure the image builder.
builder:
  arch: amd64

  # # Build image via remote server (useful for faster amd64 builds on arm64 computers)
  # remote: ssh://docker@docker-builder-server
  #
  # # Pass arguments and secrets to the Docker build process
  # args:
  #   RUBY_VERSION: ruby-3.4.10
  # secrets:
  #   - GITHUB_TOKEN
  #   - RAILS_MASTER_KEY

# Use a different ssh user than root
# ssh:
#   user: app

# Postgres como accessory, na mesma VPS -- mais barato que um banco
# gerenciado separado, cabe no CX22. bin/docker-entrypoint ja roda
# db:prepare no boot da app, que cria sozinho os 4 bancos (primary/cache/
# queue/cable) definidos em config/database.yml.
accessories:
  db:
    image: postgres:18
    host: SUBSTITUA_PELO_IP_DA_VPS
    # So acessivel localmente (mesma VPS), nunca exposto pra internet.
    port: "127.0.0.1:5432:5432"
    env:
      clear:
        POSTGRES_USER: rota_velho_chico
        # Banco inicial criado pela imagem oficial; db:prepare cria os outros 3.
        POSTGRES_DB: rota_velho_chico_production
      secret:
        - POSTGRES_PASSWORD
    directories:
      - data:/var/lib/postgresql/data
